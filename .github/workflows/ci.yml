name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor for the `X | Y` annotations used throughout; the newest
        # release catches deprecations before they become breakage.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git
        # The runner has no git identity, and the worktree tests commit.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check AGENTS.md and Cursor commands are current
        # Editing a SKILL.md without regenerating leaves Cursor and Claude Code
        # disagreeing about the same repository.
        run: python3 tools/sync_agent_files.py --check

  task-plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate every task plan
        # The gate between dev-task-split and any agent writing code: a plan whose `owns`
        # globs overlap without a dependency edge fails the build here rather than
        # surfacing later as a merge conflict.
        run: |
          shopt -s nullglob
          plans=(docs/features/*/tasks.json)
          if [ ${#plans[@]} -eq 0 ]; then
            echo "no task plans to validate"
            exit 0
          fi
          status=0
          for plan in "${plans[@]}"; do
            echo "::group::$plan"
            python3 -m orchestrator validate "$plan" || status=1
            echo "::endgroup::"
          done
          exit $status
